<div class="login-page">
  <div class="login-bg">
    <div class="orb orb--1"></div>
    <div class="orb orb--2"></div>
    <div class="grid-overlay"></div>
  </div>

  <header class="login-header">
    <a routerLink="/" class="logo">
      <span class="logo-icon">D</span>
      <span class="logo-text">Dom <span class="logo-accent">Pagamentos</span></span>
    </a>
  </header>

  <main class="login-main">
    <div class="login-card">
      <div class="card-header">
        <h1 class="card-title">Bem-vindo de volta</h1>
        <p class="card-subtitle">Entre na sua conta para acessar o painel.</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>

        <div class="field">
          <label class="label" for="email">E-mail</label>
          <input
            id="email"
            type="email"
            class="input"
            [class.input--error]="isInvalid('email')"
            formControlName="email"
            placeholder="voce@empresa.com.br"
            autocomplete="email"
          />
          @if (isInvalid('email')) {
            <span class="field-error">Informe um e-mail válido</span>
          }
        </div>

        <div class="field">
          <label class="label" for="password">
            Senha
            <a href="#" class="forgot-link">Esqueceu a senha?</a>
          </label>
          <div class="input-wrap">
            <input
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              class="input input--with-icon"
              [class.input--error]="isInvalid('password')"
              formControlName="password"
              placeholder="Sua senha"
              autocomplete="current-password"
            />
            <button type="button" class="toggle-eye" (click)="showPassword.update(v => !v)">
              @if (showPassword()) {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              } @else {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              }
            </button>
          </div>
          @if (isInvalid('password')) {
            <span class="field-error">Senha obrigatória</span>
          }
        </div>

        @if (errorMsg()) {
          <div class="alert alert--error">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            {{ errorMsg() }}
          </div>
        }

        <button type="submit" class="btn-submit" [disabled]="loading()">
          @if (loading()) {
            <span class="spinner"></span> Entrando…
          } @else {
            Entrar
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          }
        </button>
      </form>

      <p class="register-link">
        Não tem conta? <a routerLink="/cadastro">Criar conta grátis</a>
      </p>
    </div>
  </main>
</div>
